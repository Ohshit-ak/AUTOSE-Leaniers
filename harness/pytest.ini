[pytest]
# Run from harness/:  python -m pytest
# `tests` is a package here (tests/__init__.py) and `rootdir`/`pythonpath` are pinned so an
# unrelated top-level `tests` package installed elsewhere in site-packages cannot shadow ours.
testpaths = tests
pythonpath = .
# Suites added with the property / metamorphic / contract tests (tests/README.md):
#   python -m pytest -m "not lean"          text-only, a few seconds
#   python -m pytest -m "not slow"          everything except the Lean replays of recorded runs
#   HYPOTHESIS_PROFILE=thorough python -m pytest tests/test_pbt_*.py
markers =
    lean: runs Lean through lake (skipped when lake is missing)
    slow: re-checks recorded Lean files or runs many Lean jobs
